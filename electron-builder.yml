productName: DashAI
appId: com.helmutsti.dashai

# node-pty spedisce prebuild N-API (ABI-stabili): niente ricompilazione nativa,
# così il build non richiede Visual Studio / Xcode command line tools.
npmRebuild: false

# Output degli installer/eseguibili
directories:
  output: dist
  buildResources: build

# Cosa finisce dentro l'app impacchettata
files:
  - out/**
  - package.json

# node-pty è un modulo nativo: i suoi binari (pty.node, spawn-helper, winpty…)
# devono stare su disco, NON dentro l'archivio asar, altrimenti il loader non
# li trova a runtime. asarUnpack li estrae in app.asar.unpacked/.
asarUnpack:
  - "**/node_modules/node-pty/**"

# ---- Windows ----
win:
  # Icona dell'eseguibile e degli installer (generata da resources/icon.png
  # con build/make-icon.ps1). electron-builder la troverebbe da solo in build/,
  # la esplicitiamo per chiarezza.
  icon: build/icon.ico
  target:
    - target: nsis      # installer classico
      arch: [x64]
    - target: portable  # singolo .exe eseguibile senza installazione
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  # ---- Firma (certificato self-signed generato da build/make-cert.ps1) ----
  # Il .pfx NON è versionato (vedi .gitignore): rigeneralo con lo script se manca.
  # La password è di un certificato usa-e-getta, non protegge nulla di sensibile;
  # può essere sovrascritta con la variabile d'ambiente CSC_KEY_PASSWORD.
  # NB: essendo self-signed, SmartScreen mostra comunque "editore sconosciuto"
  # sui PC dove il certificato non è tra gli Autori attendibili.
  signtoolOptions:
    certificateFile: build/DashAI-selfsigned.pfx
    certificatePassword: dashai-dev
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

# ---- macOS ----
# NB: il target mac si compila SOLO su macOS (limite Apple). Da Windows viene
# ignorato. Firma/notarizzazione richiedono un Apple Developer ID.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Senza certificato Apple la firma va disattivata, altrimenti il build fallisce.
  identity: null

# ---- Linux (bonus, quasi gratis) ----
linux:
  target:
    - AppImage
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}
