name: Release

# Compila DashAI (Tauri v2) su runner nativi Windows e macOS, poi crea una
# GitHub Release con gli installer allegati negli asset.
#
# - macOS si compila SOLO su un runner macOS (limite Apple): per questo serve la CI.
# - Ad ogni tag "v*" viene creata una Release in bozza (draft) con gli installer:
#   Windows -> DashAI_<versione>_x64-setup.exe (NSIS)
#   macOS   -> DashAI_<versione>_aarch64.dmg (Apple Silicon) e _x64.dmg (Intel)
# - Si puo' anche lanciare a mano (workflow_dispatch) senza pubblicare la release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'      # Mac con Apple Silicon (M1+)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'      # Mac Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'    # Windows x64
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS non firmato: senza un Apple Developer ID il .dmg funziona ma
          # mostra l'avviso di Gatekeeper. Aggiungi i secret di firma qui quando
          # avrai un certificato (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY, ...).
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DashAI __VERSION__'
          releaseBody: 'Scarica l''installer per la tua piattaforma dagli asset qui sotto.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri per Windows produce solo l'installer NSIS. Qui aggiungiamo anche
      # l'eseguibile "portable" (l'exe grezzo da ~11 MB) tra gli asset della
      # release. Nota: la portable richiede il runtime WebView2 gia' presente
      # sul sistema (di serie su Windows 11); l'installer NSIS invece lo gestisce.
      - name: Upload Windows portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/dashai.exe" "DashAI_${VERSION}_x64-portable.exe"
          gh release upload "${GITHUB_REF_NAME}" "DashAI_${VERSION}_x64-portable.exe" --clobber
