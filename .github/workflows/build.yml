name: Build desktop apps

# Compila gli eseguibili per Windows e macOS su runner nativi.
# - macOS si compila SOLO su un runner macOS (limite Apple): per questo serve la CI.
# - Ad ogni tag "v*" pubblica una Release con gli installer allegati.
# - Si può anche lanciare a mano (workflow_dispatch) per scaricare gli artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.os }}
        run: npm run ${{ matrix.script }}
        env:
          # Nessuna firma/notarizzazione: senza Apple Developer ID il build mac
          # produce comunque un .app/.dmg (non firmato). Rimuovi queste righe e
          # aggiungi i secret CSC_* quando avrai un certificato.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dashiai-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore

  release:
    # Crea la Release solo quando si pusha un tag v*.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
