name: Bump version

# Avanza la patch a ogni push su main, committa i cinque file della versione,
# crea il tag e avvia la release.
#
# Perche' il tag non basta a far partire build.yml da solo: GitHub non
# rilancia i workflow per eventi generati con GITHUB_TOKEN — regola che qui
# ci salva dal loop infinito (il nostro push su main non rientra da questa
# stessa porta), ma che spegnerebbe anche il trigger `push: tags` di
# build.yml. `workflow_dispatch` e' una delle due eccezioni documentate a
# quella regola, quindi la release la lanciamo esplicitamente in coda.

on:
  push:
    branches: [main]

# Due push ravvicinati si contenderebbero lo stesso `git push origin main`:
# il secondo aspetta invece di fallire su un non-fast-forward.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    # Cintura oltre alle bretelle: anche se GITHUB_TOKEN non ritriggera i
    # workflow, saltare esplicitamente il nostro commit di bump rende il
    # non-loop una proprieta' leggibile invece di un dettaglio della piattaforma.
    if: ${{ !startsWith(github.event.head_commit.message, 'Porta la versione a') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit e tag
      actions: write    # lanciare build.yml via workflow_dispatch

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Avanza la patch
        id: bump
        run: |
          node scripts/bump-version.mjs patch
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Committa e tagga
        id: commit
        run: |
          if git diff --quiet; then
            echo "nessuna modifica: bump gia' applicato, niente da fare"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Porta la versione a ${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      - name: Avvia la release sul tag
        if: steps.commit.outputs.tagged == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref "v${{ steps.bump.outputs.version }}"
